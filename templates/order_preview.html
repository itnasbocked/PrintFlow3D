<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido #{{ order.id }} - {{ order.original_filename }} | PrintFlow 3D</title>

    <meta property="og:title" content="Pedido #{{ order.id }}: {{ order.original_filename }} — PrintFlow 3D">
    <meta property="og:description" content="Estado: {{ order.status }} | Formato: {{ order.file_format }} | Volumen: {{ order.volume_cm3 or 'N/A' }} cm³ | Tiempo Est: {{ order.print_time_est or 'Pendiente' }} hrs">
    <meta property="og:image" content="{{ url_for('static', filename='src/placeholder.png', _external=True) }}">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:type" content="website">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main style="max-width: 540px; margin: 4rem auto; padding: 0 1rem;">
        <div class="tech-card" style="padding: 2rem;">
            <span class="tag">PRINTFLOW 3D — SEGUIMIENTO</span>
            <h2 style="margin-top: 1rem;">Pedido #{{ order.id }}: {{ order.original_filename }}</h2>
            <img src="{{ url_for('static', filename='src/placeholder.png') }}" alt="Vista previa" style="width: 100%; height: 180px; object-fit: cover; border: 1px solid var(--black-ink); margin: 1rem 0;">
            <p><strong>Estado Actual:</strong> {{ order.status }}</p>
            <p><strong>Formato:</strong> {{ order.file_format }} | <strong>Volumen:</strong> {{ order.volume_cm3 or '--' }} cm³</p>
            <p><strong>Tiempo Estimado:</strong> {{ order.print_time_est or 'En revisión' }} hrs</p>
            <a href="{{ url_for('login') }}" class="btn-primary" style="display: inline-block; margin-top: 1rem; text-decoration: none;">Ir a la Plataforma</a>
        </div>
    </main>
</body>
</html>
